<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adjustable Widget</title>

<style>
body{
    margin:0;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
}

.widget{
    position:relative;
    width:350px;
    height:250px;
    background:#1e293b;
    color:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    overflow:hidden;
    user-select:none;
}

.resize-zone{
    position:absolute;
    right:0;
    bottom:0;
    width:20px;
    height:20px;
    cursor:nwse-resize;
    opacity:0;
}

h2{
    margin-top:0;
}
</style>
</head>
<body>

<div class="widget" id="widget">

    <h2>🎧 Adjustable Widget</h2>
    <p>
        Drag from the bottom-right corner to resize.
        The resize handle is invisible.
    </p>
    <div class="resize-zone" id="resizeZone"></div>
</div>

<script>

const widget =
document.getElementById("widget");
const resizeZone =
document.getElementById("resizeZone");
let resizing = false;
window.addEventListener("load", () => {
  const savedWidth =
        localStorage.getItem("widgetWidth");
    const savedHeight =
        localStorage.getItem("widgetHeight");
    if(savedWidth)
        widget.style.width = savedWidth;
    if(savedHeight)
        widget.style.height = savedHeight;

});
resizeZone.addEventListener("mousedown", () => {
    resizing = true;
});
document.addEventListener("mousemove", e => {
    if(!resizing) return;
    const rect =
        widget.getBoundingClientRect();
    const newWidth =
        e.clientX - rect.left;
    const newHeight =
        e.clientY - rect.top;
    if(newWidth > 250){
        widget.style.width =
            newWidth + "px";
    }
    if(newHeight > 150){
        widget.style.height =
            newHeight + "px";
    }
    localStorage.setItem(
        "widgetWidth",
        widget.style.width
    );
    localStorage.setItem(
        "widgetHeight",
        widget.style.height
    );
});

document.addEventListener("mouseup", () => {
    resizing = false;
});
</script>

</body>
</html>
