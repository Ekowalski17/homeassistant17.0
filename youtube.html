<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Search Widget</title>

<style>
body{
    background:#0f172a;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    color:white;
}

.widget{
    width:400px;
    background:#1e293b;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
}

h2{
    text-align:center;
    margin-top:0;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#ff0000;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#cc0000;
}

#status{
    margin-top:10px;
    text-align:center;
    color:#94a3b8;
}
</style>
</head>
<body>

<div class="widget">
    <h2>📺 YouTube Search</h2>

    <input
        type="text"
        id="youtubeSearch"
        placeholder="Search YouTube..."
    >

    <button onclick="searchYouTube()">
        🔍 Search
    </button>

    <div id="status">
        Type a search and press Enter or Search
    </div>
</div>

<script>

function searchYouTube(){

    const query =
        document.getElementById(
            "youtubeSearch"
        ).value.trim();

    if(!query){
        alert("Enter a search term.");
        return;
    }

    const url =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(query);

    window.open(url, "_blank");

    document.getElementById("status")
        .textContent =
        "Searching: " + query;
}

document
.getElementById("youtubeSearch")
.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        searchYouTube();
    }

});

</script>

</body>
</html>
