
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Book Widget</title>

<style>
body{
    margin:0;
    background:#0f172a;
    font-family:Arial,sans-serif;
    color:white;
    padding:20px;
    display:flex;
    justify-content:center;
}

.widget{

    min-width:250px;
    min-height:200px;
    resize:both;
    overflow:auto;
    background:#1e293b;
    border-radius:15px;
    padding:15px;
}

h1{
    text-align:center;
}

input, textarea{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    box-sizing:border-box;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#2563eb;
}

.recipe{
    background:#334155;
    border-radius:15px;
    padding:15px;
    margin-top:15px;
}

.recipe h3{
    margin-top:0;
}

.actions{
    margin-top:10px;
}

.deleteBtn{
    background:#ef4444;
}

.deleteBtn:hover{
    background:#dc2626;
}

#search{
    margin-bottom:15px;
}
</style>
</head>
<body>

<div class="widget">

<h1>🍳 Recipe Book</h1>

<input id="search"
       placeholder="🔍 Search recipes...">

<input id="recipeName"
       placeholder="Recipe Name">

<textarea id="ingredients"
placeholder="Ingredients"></textarea>

<textarea id="instructions"
placeholder="Instructions"></textarea>

<button onclick="saveRecipe()">
➕ Save Recipe
</button>

<div id="recipeList"></div>

</div>

<script>

let recipes =
JSON.parse(
localStorage.getItem("recipes")
) || [];

function saveRecipe(){

    const name =
    document.getElementById(
    "recipeName").value.trim();

    const ingredients =
    document.getElementById(
    "ingredients").value.trim();

    const instructions =
    document.getElementById(
    "instructions").value.trim();

    if(!name) return;

    recipes.push({
        id: Date.now(),
        name,
        ingredients,
        instructions
    });

    localStorage.setItem(
        "recipes",
        JSON.stringify(recipes)
    );

    document.getElementById(
    "recipeName").value="";

    document.getElementById(
    "ingredients").value="";

    document.getElementById(
    "instructions").value="";

    renderRecipes();
}

function deleteRecipe(id){

    recipes =
    recipes.filter(
    recipe=>recipe.id!==id
    );

    localStorage.setItem(
        "recipes",
        JSON.stringify(recipes)
    );

    renderRecipes();
}

function editRecipe(id){

    const recipe =
    recipes.find(
    r=>r.id===id
    );

    if(!recipe) return;

    document.getElementById(
    "recipeName").value =
    recipe.name;

    document.getElementById(
    "ingredients").value =
    recipe.ingredients;

    document.getElementById(
    "instructions").value =
    recipe.instructions;

    deleteRecipe(id);
}

function renderRecipes(){

    const search =
    document.getElementById(
    "search").value.toLowerCase();

    const list =
    document.getElementById(
    "recipeList");

    list.innerHTML="";

    recipes
    .filter(recipe =>
        recipe.name
        .toLowerCase()
        .includes(search)
    )
    .forEach(recipe=>{

        const div =
        document.createElement("div");

        div.className="recipe";

        div.innerHTML=`
        <h3>🍽 ${recipe.name}</h3>

        <strong>Ingredients:</strong>
        <p>${recipe.ingredients.replace(/\n/g,"<br>")}</p>

        <strong>Instructions:</strong>
        <p>${recipe.instructions.replace(/\n/g,"<br>")}</p>

        <div class="actions">
            <button onclick="editRecipe(${recipe.id})">
            ✏ Edit
            </button>

            <button
            class="deleteBtn"
            onclick="deleteRecipe(${recipe.id})">
            🗑 Delete
            </button>
        </div>
        `;

        list.appendChild(div);
    });
}

document
.getElementById("search")
.addEventListener(
"input",
renderRecipes
);

renderRecipes();

</script>

</body>
</html>
